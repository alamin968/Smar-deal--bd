<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Deal BD</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5f7fa;
  color:#222;
}

header{
  background:#061827;
  color:white;
  text-align:center;
  padding:28px 15px;
  border-bottom:5px solid #ffc400;
}

.logo{
  width:120px;
  height:120px;
  margin:auto;
  border-radius:50%;
  background:#061827;
  border:5px solid #ffc400;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}

header h1{
  margin-top:12px;
  font-size:34px;
  color:white;
}

header h1 span{
  color:#ffc400;
}

header p{
  margin-top:8px;
  font-size:17px;
}

nav{
  background:white;
  padding:15px;
  text-align:center;
  box-shadow:0 2px 8px #ddd;
  position:sticky;
  top:0;
  z-index:10;
}

nav a{
  color:#075d39;
  text-decoration:none;
  font-weight:bold;
  margin:0 14px;
  font-size:17px;
}

.hero{
  background:linear-gradient(135deg,#e8fff5,#fff9df);
  text-align:center;
  padding:55px 20px;
}

.hero h2{
  color:#075d39;
  font-size:32px;
  margin-bottom:15px;
}

.hero p{
  font-size:18px;
  margin-bottom:25px;
}

.btn{
  display:inline-block;
  background:#075d39;
  color:white;
  text-decoration:none;
  padding:14px 25px;
  border-radius:10px;
  font-weight:bold;
  border:0;
  cursor:pointer;
}

.btn:hover{
  background:#06472c;
}

.search-box{
  text-align:center;
  padding:30px 15px 10px;
}

.search-box input{
  width:90%;
  max-width:600px;
  padding:16px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:17px;
  outline:none;
}

.title{
  text-align:center;
  color:#075d39;
  margin:35px 0 20px;
  font-size:28px;
}

.products{
  max-width:1100px;
  margin:auto;
  padding:10px 15px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  text-align:center;
  padding:25px 18px;
  border-radius:16px;
  box-shadow:0 4px 15px #ddd;
}

.icon{
  font-size:60px;
  margin-bottom:12px;
}

.card h3{
  color:#075d39;
  font-size:21px;
  margin-bottom:10px;
}

.card p{
  color:#555;
  min-height:45px;
}

.price{
  color:#e65100;
  font-size:22px;
  font-weight:bold;
  margin:15px;
}

.order{
  display:inline-block;
  background:#25D366;
  color:white;
  text-decoration:none;
  padding:11px 18px;
  border-radius:8px;
  font-weight:bold;
}

.order:hover{
  background:#128C7E;
}

.contact{
  text-align:center;
  background:#061827;
  color:white;
  padding:45px 20px;
  margin-top:20px;
}

.contact h2{
  margin-bottom:12px;
}

footer{
  text-align:center;
  background:#030c14;
  color:white;
  padding:20px;
  font-size:14px;
}

@media(max-width:600px){
  header h1{
    font-size:29px;
  }

  .hero h2{
    font-size:27px;
  }

  nav a{
    margin:0 8px;
    font-size:15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🛍️</div>
  <h1>Smart <span>Deal</span> BD</h1>
  <p>স্মার্ট কেনাকাটা, সেরা দামে!</p>
</header>

<nav>
  <a href="#home">হোম</a>
  <a href="#products">পণ্য</a>
  <a href="#contact">যোগাযোগ</a>
</nav>

<section class="hero" id="home">
